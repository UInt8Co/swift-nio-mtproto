# Builds and runs the unit tests on every push and pull request.
#
# The job runs in the swift:6.4.0-noble toolchain image and leans on caching:
#   * ~/.cache/org.swift.swiftpm — cloned SwiftPM dependencies (swift-mtproto,
#     swift-nio, swift-crypto …)
#   * .build                     — Swift incremental build products
# Source-derived keys carry the commit sha so each run saves a fresh cache, and
# restore-keys fall back to the most recent prefix match for a warm incremental
# build. The test RSA key is committed under Fixtures/, so nothing is generated.
name: CI

on:
  push:
  pull_request:

# A newer push to the same ref makes in-flight runs obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Swift unit tests
    runs-on: ubuntu-latest
    container: swift:6.4.0-noble
    steps:
      - name: Check out
        uses: actions/checkout@v6

      - name: Cache SwiftPM dependencies
        uses: actions/cache@v5
        with:
          path: ~/.cache/org.swift.swiftpm
          key: swiftpm-deps-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            swiftpm-deps-${{ runner.os }}-

      - name: Cache Swift build products
        uses: actions/cache@v5
        with:
          path: .build
          key: swift-unit-${{ runner.os }}-swift6.4.0-${{ hashFiles('Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            swift-unit-${{ runner.os }}-swift6.4.0-${{ hashFiles('Package.resolved') }}-
            swift-unit-${{ runner.os }}-swift6.4.0-

      - name: Run unit tests
        run: swift test

  format:
    name: Format
    runs-on: ubuntu-latest
    container: swift:6.4.0-noble
    steps:
      - name: Check out
        uses: actions/checkout@v6

      - name: Lint formatting
        run: swift format lint --strict --recursive Package.swift Sources Tests
